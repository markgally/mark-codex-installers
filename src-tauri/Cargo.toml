[package]
name = "jarvis-codex"
version = "0.2.8"
description = "A Jarvis holographic client for Codex native realtime voice"
authors = ["bigguan"]
edition = "2021"

[lib]
name = "jarvis_codex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["multipart"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-autostart = "2.5.1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
