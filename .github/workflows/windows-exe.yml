name: Windows executable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Mark Codex.exe
        run: npm run build

      - name: Collect executable
        shell: pwsh
        run: |
          $built = @(Get-ChildItem -Path src-tauri\target\release -Filter *.exe |
            Where-Object { $_.DirectoryName -notmatch '\\deps$' })
          if ($built.Count -lt 1) { throw 'No release executable was produced' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $built[0].FullName -Destination "artifact\Mark Codex.exe"

      - name: Upload Mark Codex.exe
        uses: actions/upload-artifact@v4
        with:
          name: Mark-Codex-exe
          path: artifact/Mark Codex.exe
          if-no-files-found: error
